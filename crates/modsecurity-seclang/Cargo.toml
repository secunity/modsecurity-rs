[package]
name = "modsecurity-seclang"
version.workspace = true
edition.workspace = true
description = "The SecLang configuration syntax: a pest grammar and the syntax tree it produces"
license.workspace = true
publish = false

[dependencies]
# The grammar (`src/seclang.pest`). Without `std`: pest's stack-overflow
# guard probes the stack on every rule call (~10% of the parse), and this
# grammar has no recursive rules.
pest = { version = "2.9", default-features = false, features = ["memchr"] }
pest_derive = { version = "2.9", default-features = false }
