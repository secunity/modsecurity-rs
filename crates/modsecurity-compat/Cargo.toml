[package]
name = "modsecurity-compat"
version.workspace = true
edition.workspace = true
description = "Data structures and parsers that reproduce the observable behavior of the C++ libmodsecurity: libstdc++'s unordered_multimap order, yajl's JSON, C number parsing"
license.workspace = true
publish = false

[dev-dependencies]
# inet_pton, which the address parsers are compared with.
modsecurity-native = { path = "../modsecurity-native", features = ["testing"] }
rand = "0.9"
