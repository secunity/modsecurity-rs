[package]
name = "modsecurity-types"
version.workspace = true
edition.workspace = true
description = "The values ModSecurity resolves variables to (VariableValue, VariableOrigin) and the key exclusions of a variable, shared by the engine and the collections"
license.workspace = true
publish = false

[dependencies]
# Regex key exclusions (`!ARGS:/regex/`): PCRE2, as everywhere in the engine.
modsecurity-native = { path = "../modsecurity-native" }
# A value's origins: almost every value has one, kept inline instead of in
# an allocation of its own.
smallvec = "1.13"
