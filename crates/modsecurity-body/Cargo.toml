[package]
name = "modsecurity-body"
version.workspace = true
edition.workspace = true
description = "The request body processors of ModSecurity (multipart, JSON, XML), against small context interfaces"
license.workspace = true
publish = false

[features]
# The XML processor (the engine's feature of the same name).
libxml2 = ["modsecurity-native/libxml2"]

[dependencies]
# The debug log interface (DebugSink, ms_dbg).
modsecurity-types = { path = "../modsecurity-types" }
# libxml2 (the XML processor) and mkstemp (uploaded files).
modsecurity-native = { path = "../modsecurity-native" }
# The yajl-compatible JSON reader and the byte helpers.
modsecurity-compat = { path = "../modsecurity-compat" }
# URL decoding (multipart `filename*`).
modsecurity-transformations = { path = "../modsecurity-transformations" }
