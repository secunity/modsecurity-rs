[package]
name = "modsecurity-operators"
version.workspace = true
edition.workspace = true
description = "The SecLang operators that only match (@rx, @pm, @contains, ...), against a small context interface"
license.workspace = true
publish = false

[features]
# Enabled by the engine's features of the same names.
# @validateDTD and @validateSchema (without it they log that they are not
# implemented and match, as in C++).
libxml2 = ["modsecurity-native/libxml2"]
ssdeep = ["modsecurity-native/ssdeep"]
regex-dollar-endonly = []
# @geoLookup with MaxMind databases (without it no database opens).
maxmind = ["dep:maxminddb"]

[dependencies]
# The debug log interface (DebugSink, ms_dbg).
modsecurity-types = { path = "../modsecurity-types" }
# PCRE2 (@rx, @verifyCC, ...) and ssdeep (@fuzzyHash).
modsecurity-native = { path = "../modsecurity-native" }
# The byte helpers and the C number conversions.
modsecurity-compat = { path = "../modsecurity-compat" }
# @detectSQLi and @detectXSS.
libinjection = { path = "../../others/libinjection" }
# @pm, @pmFromFile and @pmf: the phrase matcher, in place of the C++ ACMP,
# which misses matches and reports phrases that are not in the list.
aho-corasick = "1"
# @rbl: the DNS lookup of the block list, with the platform getaddrinfo as
# in C++. @geoLookup: the same function, to read an address as
# libmaxminddb does.
dns-lookup = "4.0.2"
# The networks of an @ipMatch list: a set with longest-prefix lookups, in
# place of the C++ crit-bit tree, which misses addresses when networks
# overlap.
prefix-trie = { version = "0.10", default-features = false, features = ["ipnet"] }
ipnet = "2"
# The getaddrinfo flags of @geoLookup.
libc = "0.2"
maxminddb = { version = "0.32", optional = true }

[dev-dependencies]
# inet_pton, which the address parsers of @ipMatch are compared with.
modsecurity-native = { path = "../modsecurity-native", features = ["testing"] }
rand = "0.9"
