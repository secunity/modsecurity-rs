[package]
name = "modsecurity-operators"
version = "3.0.17"
edition = "2024"
description = "The SecLang operators that only match (@rx, @pm, @contains, ...), against a small context interface"
license = "Apache-2.0"
publish = false

[features]
# Enabled by the engine's features of the same names.
# @validateDTD and @validateSchema (without it they log that they are not
# implemented and match, as in C++).
libxml2 = ["modsecurity-native/libxml2"]
ssdeep = ["modsecurity-native/ssdeep"]
regex-dollar-endonly = []
pm-aho-corasick = ["dep:aho-corasick"]

[dependencies]
# The debug log interface (DebugSink, ms_dbg).
modsecurity-types = { path = "../modsecurity-types" }
# PCRE2 (@rx, @verifyCC, ...) and ssdeep (@fuzzyHash).
modsecurity-native = { path = "../modsecurity-native" }
# ACMP (@pm), the IP tree (@ipMatch) and the byte helpers.
modsecurity-compat = { path = "../modsecurity-compat" }
# @detectSQLi and @detectXSS.
libinjection = { path = "../../others/libinjection" }
aho-corasick = { version = "1", optional = true }
# @rbl: the DNS lookup of the block list, with the platform getaddrinfo as
# in C++.
dns-lookup = "4.0.2"
