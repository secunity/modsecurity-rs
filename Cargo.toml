[workspace]
resolver = "3"
members = [
    ".",
    "others/libinjection",
    "crates/modsecurity-native",
    "crates/modsecurity-transformations",
    "crates/modsecurity-capi",
    "connectors/nginx",
    "examples/axum",
]
# connectors/nginx needs an nginx source/build tree (NGINX_SOURCE_DIR,
# NGINX_BUILD_DIR) to build, so plain `cargo build`/`cargo test` skip it;
# build it with `cargo build --release -p modsecurity-nginx`. The axum
# example is skipped too (it pulls in axum and tokio): `cargo test -p
# modsecurity-axum-example`.
default-members = [
    ".",
    "others/libinjection",
    "crates/modsecurity-native",
    "crates/modsecurity-transformations",
    "crates/modsecurity-capi",
]

[workspace.package]
version = "0.2.0"
edition = "2024"

[package]
name = "modsecurity"
version = "3.0.17"
edition = "2024"
description = "Rust port of libmodsecurity v3 (ModSecurity web application firewall engine)"
license = "Apache-2.0"

[lib]
name = "modsecurity"
path = "src/lib.rs"
# The C library (libmodsecurity.so.3, the msc_* API) is built by
# crates/modsecurity-capi.

[[bin]]
name = "regression_tests"
path = "test/regression/regression.rs"
required-features = []

[[bin]]
name = "unit_tests"
path = "test/unit/unit.rs"

[[bin]]
name = "modsec-rules-check"
path = "tools/rules-check/rules_check.rs"

[[test]]
name = "suites"
path = "test/suites.rs"

[features]
default = ["libxml2", "lua", "maxmind", "lmdb", "ssdeep", "curl"]
# Each feature mirrors one of the optional dependencies of the C++ build
# (WITH_LIBXML2, WITH_LUA, WITH_MAXMIND, WITH_LMDB, WITH_SSDEEP, WITH_CURL).
libxml2 = ["modsecurity-native/libxml2"]
lua = ["dep:mlua", "modsecurity-native/lua"]
maxmind = ["dep:maxminddb"]
lmdb = ["modsecurity-native/lmdb"]
ssdeep = ["modsecurity-native/ssdeep"]
curl = ["dep:curl"]
# Mirrors the MODSEC_REGEX_DOLLAR_ENDONLY build option.
regex-dollar-endonly = []
# Not a C++ option (off by default): match @pm/@pmFromFile/@pmf phrases with
# the aho-corasick crate instead of the port of the C++ ACMP parser, fixing
# ACMP's missed and misreported matches. Changes detection results and
# TX:0/log contents compared with C++ (see src/operators/pm.rs).
pm-aho-corasick = ["dep:aho-corasick"]
# Not a C++ option (off by default): store @ipMatch/@ipMatchFromFile/@ipMatchF
# networks in a prefix trie (prefix-trie + ipnet crates) instead of the port of
# the C++ crit-bit tree, fixing its missed matches when a list holds several
# networks. Changes detection results compared with C++ (see
# src/utils/msc_tree.rs).
ipmatch-prefix-trie = ["dep:prefix-trie", "dep:ipnet"]
# Not a C++ option (off by default): feed `http` crate requests and
# responses into a transaction (`Transaction::process_request_head`, ...)
# and turn an intervention into an `http::Response`.
http = ["dep:http"]
# Not a C++ option (off by default): a tower middleware that runs the
# transaction phases around an HTTP service (`modsecurity::middleware`).
tower = ["http", "dep:bytes", "dep:http-body", "dep:http-body-util", "dep:tower-layer", "dep:tower-service"]

[dependencies]
# The C libraries (PCRE2, libxml2, LMDB, ssdeep, Lua, libc calls) behind
# safe APIs: all the unsafe code.
modsecurity-native = { path = "crates/modsecurity-native" }
# The transformations (t:...) and the decoders shared with them.
modsecurity-transformations = { path = "crates/modsecurity-transformations" }
# libc constants (errno values, address families).
libc = "0.2"
# Byte-string helpers: request data is arbitrary bytes, not UTF-8.
bstr = "1.13"
# Replace mbedtls' md5/sha1.
md-5 = "0.11"
sha1 = "0.11"
# Pure-Rust libinjection (SQLi fingerprinting / XSS detection), vendored.
libinjection = { path = "others/libinjection" }
mlua = { version = "0.12", features = ["lua54", "vendored"], optional = true }
maxminddb = { version = "0.32", optional = true }
# libcurl binding (SecRemoteRules, HTTPS audit log writer, remote pm/ip files).
curl = { version = "0.4", optional = true }
# Random numbers (transaction id suffix, audit log boundaries); replaces the
# C++ <random> engine and libc rand()/srand().
rand = "0.9"
# Local time and strftime-style formatting (audit log timestamps and
# directories, TIME* variables); replaces libc localtime_r/strftime.
jiff = "0.2"
aho-corasick = { version = "1", optional = true }
prefix-trie = { version = "0.10", default-features = false, features = ["ipnet"], optional = true }
ipnet = { version = "2", optional = true }
rustix = { version = "1.1.6", features = ["system", "fs", "process", "time"] }
dns-lookup = "4.0.2"
nix = { version = "0.31.3", default-features = false, features = ["net"] }
# The SecLang grammar (`src/parser/seclang.pest`). Without `std`: pest's
# stack-overflow guard probes the stack on every rule call (~10% of the
# parse), and this grammar has no recursive rules.
pest = { version = "2.9", default-features = false, features = ["memchr"] }
pest_derive = { version = "2.9", default-features = false }
# The `http` and `tower` features: the request/response types of the Rust
# HTTP ecosystem (hyper, axum, tonic, ...) and its middleware interface
# (`Service`/`Layer`), so that the engine embeds in those servers without
# glue code. Bodies are buffered with `http-body-util`.
http = { version = "1.4", optional = true }
bytes = { version = "1.11", optional = true }
http-body = { version = "1.0", optional = true }
http-body-util = { version = "0.1.3", optional = true }
tower-layer = { version = "0.3.3", optional = true }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
# The C functions the tests compare with (inet_pton, snprintf, strftime).
modsecurity-native = { path = "crates/modsecurity-native", features = ["testing"] }

[profile.release]
# The engine is several crates: without LTO, calls between them (the
# transformations, the decoders) are not inlined, which measured 1-2% of
# throughput. Thin LTO removes that cost for little build time.
lto = "thin"

[profile.dev]
opt-level = 1
