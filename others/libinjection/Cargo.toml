[package]
name = "libinjection"
description = "Pure-Rust libinjection: SQL injection and XSS detection over raw bytes"
version = "0.2.0"
edition = "2024"

[features]
# Exposes the corpus loader used by the tests and the eval example.
testdata = []

[dependencies]

[dev-dependencies]
libinjection = { path = ".", features = ["testdata"] }
# Another Rust libinjection, compared with this one by the eval example
# (detections on the corpora) and the detect bench (throughput).
libinjectionrs = "0.1"
# The detect bench.
criterion = "0.8"

[[bench]]
name = "detect"
harness = false
