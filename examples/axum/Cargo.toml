[package]
name = "modsecurity-axum-example"
version = "0.0.0"
edition.workspace = true
description = "An axum server protected by the ModSecurity tower middleware"
license.workspace = true
publish = false

[dependencies]
modsecurity = { path = "../..", features = ["tower"] }
# The web framework the example protects, and its runtime.
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
